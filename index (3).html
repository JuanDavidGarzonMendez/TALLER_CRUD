<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario de Repuestos</title>
  <!-- Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- ENCABEZADO: título, contador de registros y botón de exportar -->
  <header class="bg-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-bold">Inventario de Repuestos de Motocicletas</h1>
      <div class="flex items-center gap-3">
        <span class="bg-indigo-100 text-indigo-700 text-sm font-semibold px-3 py-1 rounded-full">
          Total: <span id="contador">0</span>
        </span>
        <button id="btnExportar" type="button" class="bg-slate-800 hover:bg-slate-700 text-white text-sm px-4 py-2 rounded-lg">
          Exportar JSON
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 grid gap-6">

    <!-- FORMULARIO: sirve para crear y para editar -->
    <section class="bg-white rounded-xl shadow p-5">
      <h2 id="tituloForm" class="font-semibold mb-4">Nuevo repuesto</h2>
      <form id="formulario" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div>
          <label for="nombre" class="block text-sm mb-1">Nombre / Código</label>
          <input id="nombre" type="text" required minlength="2" maxlength="60" placeholder="Ej: Pastillas de freno X1"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div>
          <label for="categoria" class="block text-sm mb-1">Categoría</label>
          <select id="categoria" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="">Seleccione...</option>
            <option>Frenos</option>
            <option>Motor</option>
            <option>Transmisión</option>
            <option>Eléctrico</option>
            <option>Suspensión</option>
            <option>Llantas</option>
          </select>
        </div>
        <div>
          <label for="cantidad" class="block text-sm mb-1">Cantidad</label>
          <input id="cantidad" type="number" required min="0" step="1" placeholder="0"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div>
          <label for="estado" class="block text-sm mb-1">Estado</label>
          <select id="estado" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="">Seleccione...</option>
            <option>Disponible</option>
            <option>Bajo stock</option>
            <option>Agotado</option>
          </select>
        </div>
        <div class="sm:col-span-2 lg:col-span-4 flex gap-3">
          <button id="btnGuardar" type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg">
            Guardar Registro
          </button>
          <!-- Oculto hasta que se entra en modo edición -->
          <button id="btnCancelar" type="button" class="hidden bg-slate-200 hover:bg-slate-300 px-5 py-2 rounded-lg">
            Cancelar
          </button>
        </div>
      </form>
    </section>

    <!-- LISTADO: búsqueda en tiempo real y tabla -->
    <section class="bg-white rounded-xl shadow p-5">
      <div class="flex flex-col sm:flex-row gap-3 mb-4">
  <input id="buscador" type="search" placeholder="Buscar por nombre, categoría o estado..."
    class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
  <select id="filtroCategoria" class="border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
    <option value="">Todas las categorías</option>
    <option>Frenos</option>
    <option>Motor</option>
    <option>Transmisión</option>
    <option>Eléctrico</option>
    <option>Suspensión</option>
    <option>Llantas</option>
  </select>
  <button id="btnLimpiar" type="button" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg">
    Limpiar filtros
  </button>
</div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-50 text-slate-600">
            <tr>
              <th class="px-3 py-2">Nombre / Código</th>
              <th class="px-3 py-2">Categoría</th>
              <th class="px-3 py-2">Cantidad</th>
              <th class="px-3 py-2">Estado</th>
              <th class="px-3 py-2 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <!-- Estado vacío -->
      <div id="vacio" class="hidden text-center py-10 text-slate-500">
        <p class="text-4xl mb-2">📦</p>
        <p>No hay repuestos para mostrar.</p>
        <p class="text-sm">Agrega uno con el formulario de arriba.</p>
      </div>
    </section>
  </main>

  <!-- Contenedor de notificaciones Toast -->
  <div id="toasts" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>

  <script src="app.js"></script>
</body>
</html>
